spring.application.name=cloudmigration-backend
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
basex.url=${BASEX_URL:http://127.0.0.1:8984/rest}
basex.username=${BASEX_USERNAME:cloudmigration}
basex.password=${BASEX_PASSWORD:}
basex.database=${BASEX_DATABASE:cloudmigration}
springdoc.swagger-ui.path=/swagger-ui.html

spring.config.import=optional:file:.env[.properties]
